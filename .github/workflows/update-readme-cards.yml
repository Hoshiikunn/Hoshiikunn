name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *"      # 每天 UTC 00:00（北京时间早上 8 点）自动跑
  workflow_dispatch:          # 允许手动点击 Run 按钮触发，方便调试

permissions:
  contents: write             # 允许 Action 把生成的 SVG 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: stats
          options: username=Hoshiikunn&show_icons=true&theme=tokyonight
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: top-langs
          options: username=Hoshiikunn&layout=compact&theme=tokyonight
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: Pranesh-2005/github-readme-stats-fast-action@v1.3
        with:
          card: streak
          options: username=Hoshiikunn&theme=tokyonight&locale=zh_CN
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || echo "No changes to commit"
          git push
